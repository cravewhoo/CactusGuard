# All text players and staff see lives here. MiniMessage format. Placeholders use <name>.
# Bright green = #39FF14, soft green = #A8FF78.

prefix: "<#39FF14>❀ ᴄᴀᴄᴛᴜѕɢᴜᴀʀᴅ <dark_gray>» <gray>"

general:
  no-permission: "<red>You don't have permission to do that."
  players-only: "<red>Only players can use this."
  unknown-player: "<red>Unknown player <white><name><red>. They must have joined before."
  bad-duration: "<red>Invalid duration <white><input><red>. Try 30m, 2h, 7d or 1d6h."
  db-error: "<red>Database error, check the console."
  reloaded: "<#39FF14>Config and messages reloaded."
  cant-punish-self: "<red>You can't punish yourself."
  cant-punish-bypass: "<red><name> can't be punished."
  usage: "<red>Usage: <white><usage>"

gui:
  hub-title: "ᴄᴀᴄᴛᴜѕɢᴜᴀʀᴅ"
  players-title: "ᴘʟᴀʏᴇʀѕ"
  player-title: "<name>"
  reports-title: "ʀᴇᴘᴏʀᴛѕ"
  history-title: "ʜɪѕᴛᴏʀʏ"
  notes-title: "ɴᴏᴛᴇѕ"
  duration-title: "ᴅᴜʀᴀᴛɪᴏɴ"
  reason-title: "ʀᴇᴀѕᴏɴ"
  back: "ʙᴀᴄᴋ"
  next: "ɴᴇxᴛ ᴘᴀɢᴇ"
  prev: "ᴘʀᴇᴠ ᴘᴀɢᴇ"
  close: "ᴄʟᴏѕᴇ"
  all-clear: "ᴀʟʟ ᴄʟᴇᴀʀ"
  pending: "<count> ᴘᴇɴᴅɪɴɢ"
  click-claim: "Click: claim"
  click-resolve: "Shift-click: resolve"
  click-dismiss: "Right-click: dismiss"
  click-open: "Click to open"
  prompt-note: "<#39FF14>Type the note in chat <gray>(or 'cancel')."
  prompt-reason: "<#39FF14>Type a custom reason in chat <gray>(or 'cancel')."
  prompt-cancelled: "<gray>Cancelled."

punish:
  broadcast: "<white><target> <gray>was <#39FF14><verb><time> <gray>by <white><staff><gray>. Reason: <white><reason>"
  done: "<#39FF14>Case #<id> recorded for <name>."
  muted-notice: "<red>You have been muted<time><red>. Reason: <white><reason>"
  warned-notice: "<yellow>You were warned: <white><reason>"
  muted-chat: "<red>You are muted <left>. <gray>Reason: <white><reason>"
  pardoned: "<white><target> <gray>was <#39FF14><verb> <gray>by <white><staff>"
  pardon-done: "<#39FF14><name> is no longer <state>."
  nothing-active: "<red><name> has no active <what>."
  threshold-reason: "Reached <count> warnings"
  screen-ban-perm: "You are permanently banned"
  screen-ban-temp: "You are temporarily banned"
  screen-kick: "You were kicked"
  screen-reason: "Reason"
  screen-left: "Time left"
  screen-case: "Case"

report:
  usage: "/report <player> <reason>"
  self: "<red>You can't report yourself."
  short: "<red>Please give a reason (at least <min> characters)."
  cooldown: "<red>Please wait <seconds>s before sending another report."
  cap: "<red>You already have <cap> open reports. Wait for staff to review them."
  sent: "<#39FF14>Report #<id> sent. Staff have been notified."
  alert: "<#39FF14>New report <gray>#<id> <white><target> <gray>by <white><reporter><gray>: <white><reason> <gray>(<#A8FF78>/cg<gray>)"
  updated: "<gray>Report <#39FF14>#<id> <gray><status> by <white><by>"
  reporter-update: "<gray>Your report #<id> against <white><target> <gray>was <#39FF14><status><gray>. Thanks for keeping the server clean."
  waiting: "<#39FF14><count> <gray>report(s) waiting. <#A8FF78>/cg"
  not-found: "<red>No report with id #<id>."

notes:
  saved: "<#39FF14>Note #<id> saved for <name>."
  removed: "<#39FF14>Note #<id> removed."
  not-found: "<red>No note with id #<id>."
  alert: "<gray>Note added on <white><target> <gray>by <white><author>"
  join-alert: "<white><name> <gray>joined with <#39FF14><warns> warning(s) <gray>and <#39FF14><notes> note(s)<gray>. <#A8FF78>/history <name>"
  empty: "<gray>No notes on file."
